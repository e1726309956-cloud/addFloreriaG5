<!doctype html>
<html lang="es">
<body style="margin:0;padding:28px;background:#fff9f6;font-family:Arial,sans-serif;color:#45343a">
  <div style="max-width:520px;margin:auto;background:#fff;border:1px solid #ebdce0;border-radius:12px;overflow:hidden">
    <div style="background:#7d273e;padding:20px 24px;color:#fff;font-size:18px;font-weight:bold">Nova Florería</div>
    <div style="padding:24px">
      <h1 style="font-size:22px;color:#7d273e">Recupera tu contraseña</h1>
      <p>Ingresa este código en la aplicación para continuar:</p>
      <p style="padding:18px;text-align:center;background:#f9eef1;color:#7d273e;font-size:28px;font-weight:bold;letter-spacing:5px">{{ .Token }}</p>
      <p>Si no solicitaste cambiar tu contraseña, puedes ignorar este mensaje.</p>
    </div>
  </div>
</body>
</html>
